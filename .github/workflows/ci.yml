name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Audit
        run: npm audit --audit-level=moderate
      - name: Verify npm signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: npm run typecheck
      - name: Verify contract version matches the package version
        run: npx cli-contracts version-sync --check
      - name: Build
        run: npm run build
      - name: Bundle
        run: npm run bundle
      - name: Design consistency
        run: node dist/speckeeper.bundle.mjs lint
      - name: Documentation is regenerated from the models
        run: |
          node dist/speckeeper.bundle.mjs build
          npm run docs
          git diff --exit-code -- docs/
          if grep -rn '⚠️' docs/; then
            echo "::error::generated documentation contains an unresolved embed marker"
            exit 1
          fi
      - name: Test
        run: npm run test:ci
      - name: The bundle runs standalone outside the repository
        run: npm run test:bundle
      - name: Verify package contents
        run: npm pack --dry-run

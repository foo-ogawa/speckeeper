name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gates that inspect declarations or generated bytes. Their outcome does not
  # depend on the operating system or the runtime, so they run once.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Audit
        run: npm audit --audit-level=moderate
      - name: Verify npm signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: npm run typecheck
      - name: Verify contract version matches the package version
        run: npx cli-contracts version-sync --check
      - name: Build
        run: npm run build
      - name: Bundle
        run: npm run bundle
      - name: Design consistency
        run: node dist/speckeeper.bundle.mjs lint
      - name: Generated artifacts match the models
        run: |
          node dist/speckeeper.bundle.mjs drift --fail-on-drift
          npm run docs
          git diff --exit-code -- docs/
          if grep -rn '⚠️' docs/; then
            echo "::error::generated documentation contains an unresolved embed marker"
            exit 1
          fi
      - name: Verify package contents
        run: npm pack --dry-run

  # The suites run on every supported runtime and operating system, since that is
  # what "verified on" means for them.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Build
        run: npm run build
      - name: Bundle
        run: npm run bundle
      - name: Test
        run: npm run test:ci
      - name: The bundle runs standalone outside the repository
        run: npm run test:bundle

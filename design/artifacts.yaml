entries:
  - model: artifact
    specs:
      - id: ART-001
        name: SSOT
        category: ssot
        location: design/
        purpose: TypeScript models (source of truth) = requirement/design definitions
        driftTarget: false
      - id: ART-002
        name: Human-readable artifacts
        category: human-readable
        location: docs/
        purpose: Markdown/Mermaid (for review)
        driftTarget: true
        generatedFrom: ART-001
      - id: ART-003
        name: Machine-readable artifacts
        category: machine-readable
        location: specs/
        purpose: JSON/JSON Schema for consistency checking
        driftTarget: true
        generatedFrom: ART-001
      - id: ART-004
        name: Implementation code
        category: implementation
        location: src/
        purpose: Application implementation (not managed by speckeeper)
        driftTarget: false
  - model: directory-entry
    specs:
      - id: DIR-001
        path: design/
        description: YAML spec data and TypeScript models (source of truth) = upstream SSOT
        artifactId: ART-001
        children:
          - id: DIR-001-01
            path: _models/
            description: Model definitions (schemas, lint rules, exporters)
            filePattern: "*.ts"
          - id: DIR-001-02
            path: requirements.yaml
            description: Requirement definitions
            filePattern: "*.yaml"
          - id: DIR-001-03
            path: usecases.yaml
            description: Use case and actor definitions
            filePattern: "*.yaml"
          - id: DIR-001-04
            path: architecture.yaml
            description: Logical architecture (C4 System/Container)
            filePattern: "*.yaml"
          - id: DIR-001-05
            path: concept-model.yaml
            description: Concept model (Entity/Relation)
            filePattern: "*.yaml"
          - id: DIR-001-06
            path: glossary.yaml
            description: Glossary
            filePattern: "*.yaml"
          - id: DIR-001-07
            path: artifacts.yaml
            description: Artifact and directory structure definitions
            filePattern: "*.yaml"
          - id: DIR-001-08
            path: cli-commands.yaml
            description: CLI command specifications
            filePattern: "*.yaml"
          - id: DIR-001-09
            path: test-refs.yaml
            description: Test definitions and requirement linkage
            filePattern: "*.yaml"
          - id: DIR-001-10
            path: index.ts
            description: Design entry point (model and spec registration)
            filePattern: "*.ts"
      - id: DIR-002
        path: docs/
        description: Human-readable documents (generated; embedoc updates marker sections)
        artifactId: ART-002
        children:
          - id: DIR-002-01
            path: framework_requirements_spec.md
            description: Framework requirements specification (sections auto-updated via embedoc)
          - id: DIR-002-02
            path: model-guide.md
            description: Model definition guide
          - id: DIR-002-03
            path: model_entity_catalog.md
            description: Model and entity catalog
          - id: DIR-002-04
            path: scaffold-mermaid-spec.md
            description: Mermaid-driven model scaffolding specification
          - id: DIR-002-05
            path: cli-reference.md
            description: CLI reference (generated from cli-contract.yaml)
          - id: DIR-002-06
            path: directory-entries.md
            description: Directory structure
          - id: DIR-002-07
            path: design/
            description: Per-model specification documents
      - id: DIR-003
        path: specs/
        description: Machine-readable artifacts (JSON Schema for consistency checking)
        artifactId: ART-003
        children:
          - id: DIR-003-01
            path: schemas/
            description: JSON Schema
            children:
              - id: DIR-003-01-01
                path: entities/
                description: Entity JSON Schema (E-001.json, etc.)
                filePattern: "*.json"
          - id: DIR-003-02
            path: index.json
            description: Aggregated data (reference graph for all models)
      - id: DIR-004
        path: src/
        description: Application implementation code (not managed by speckeeper)
        artifactId: ART-004

entries:
  - model: functional-requirement
    specs:
      - id: FR-100
        name: Common Requirements (All Models)
        description: Defines common requirements that apply to all models.
        type: functional
        priority: must
        category: common
        acceptanceCriteria:
          - id: FR-100-01
            description: All child requirements (FR-101, FR-102, FR-104) are satisfied
            verificationMethod: review
        relations:
          - type: satisfies
            target: UC-001
            description: Satisfies requirement definition use case
          - type: satisfies
            target: UC-002
            description: Satisfies architecture definition use case
      - id: FR-101
        name: ID Management
        description: All model elements have a unique `id` and provide ID-based reference and consistency checking
        type: functional
        priority: must
        category: common
        parentId: FR-100
        rationale: To prevent ID duplication, ensure reference integrity, and maintain traceability
        acceptanceCriteria:
          - id: FR-101-01
            description: All model elements have a unique id
            verificationMethod: test
          - id: FR-101-02
            description: id follows conventions (e.g., REQ-OBS-001, ENT-ORDER, COMP-API)
            verificationMethod: test
          - id: FR-101-03
            description: References are expressed by ID and reference integrity checking is provided
            verificationMethod: test
          - id: FR-101-04
            description: ID changes detect all reference locations via reference integrity check (lint)
            verificationMethod: test
        notes: |-
          **Impact of ID Changes**
          - ID changes detect all reference locations via reference integrity check (lint)
          - **Change Impact Analysis CLI**: `speckeeper impact {ID}` lists the impact scope
        relations:
          - type: satisfies
            target: UC-001
            description: Satisfies requirement definition use case
      - id: FR-102
        name: Phase Management
        description: Set phase (REQ/HLD/LLD/OPS) on models and verify phase gates
        type: functional
        priority: must
        category: common
        parentId: FR-100
        rationale: To ensure no items requiring resolution in subsequent phases remain
        acceptanceCriteria:
          - id: FR-102-01
            description: Phase can be handled as REQ | HLD | LLD | OPS
            verificationMethod: test
          - id: FR-102-02
            description: Can set phase in model definition and verify phase gate
            verificationMethod: test
          - id: FR-102-03
            description: TBD is allowed/prohibited at specified phase
            verificationMethod: test
        relations:
          - type: satisfies
            target: UC-001
            description: Satisfies requirement definition use case
      - id: FR-104
        name: Model Definition
        description: Define and register project-specific models in TypeScript
        type: functional
        priority: must
        category: common
        parentId: FR-100
        rationale: To define project-specific models (Requirement, Entity, Screen, Runbook, etc.) in a unified way
        acceptanceCriteria:
          - id: FR-104-01
            description: Can define models by inheriting from Model base class
            verificationMethod: test
          - id: FR-104-02
            description: Can define runtime validation with Zod schema
            verificationMethod: test
          - id: FR-104-03
            description: Can define model-specific lint rules
            verificationMethod: test
          - id: FR-104-04
            description: Can define model-specific renderers (text output functions)
            verificationMethod: test
          - id: FR-104-05
            description: Can define external SSOT consistency checkers (optional)
            verificationMethod: test
          - id: FR-104-06
            description: "Can register as models: [...] in speckeeper.config.ts"
            verificationMethod: demo
          - id: FR-104-07
            description: Registered models become targets of lint/build/drift/check
            verificationMethod: test
          - id: FR-104-08
            description: Can set modelLevel on models to enable relation constraint verification
            verificationMethod: test
          - id: FR-104-09
            description: Can get model level (L0/L1/L2/L3) via Model.level property
            verificationMethod: test
        notes: |-
          **Model Definition Components**

          | Element | Required | Description |
          |---------|----------|-------------|
          | `id` | ✓ | Unique identifier for the model |
          | `name` | ✓ | Model name (for display) |
          | `idPrefix` | ✓ | ID prefix (e.g., `REQ-`, `ENT-`) |
          | `schema` | ✓ | Zod schema |
          | `modelLevel` | | Model level (L0/L1/L2/L3) - Used for relation constraint verification |
          | `lintRules` | | Model-specific lint rules |
          | `renderers` | | Renderers (text output functions) |
          | `externalChecker` | | External SSOT consistency checker |

          **Defined Models (design/_models/)**

          The following models are defined in this project:

          | Model | ID Prefix | Purpose |
          |-------|-----------|---------|
          | Requirement | `REQ-` | Requirement definition |
          | UseCase | `UC-` | Use case |
          | Term | `TERM-` | Term definition |
          | Architecture | `COMP-`/`LAYER-` | Architecture |
          | ConceptModel | `ENT-`/`REL-` | Concept model |
          | Screen | `SCR-` | Screen definition |
          | ProcessFlow | `FLOW-` | Process flow |
          | APIRef | `API-` | API reference (external SSOT) |
          | TableRef | `TBL-` | Table reference (external SSOT) |
          | IaCRef | `IAC-` | IaC reference (external SSOT) |
          | BatchRef | `BATCH-` | Batch reference (external SSOT) |
        examples:
          - language: typescript
            code: |-
              // Model definition example
              import { z } from 'zod';
              import { Model } from 'speckeeper';

              const RunbookSchema = z.object({
                id: z.string(),
                title: z.string(),
                severity: z.enum(['critical', 'high', 'medium', 'low']),
                symptoms: z.array(z.string()),
                steps: z.array(z.object({
                  order: z.number(),
                  action: z.string(),
                  verification: z.string().optional(),
                })),
              });

              class RunbookModel extends Model<typeof RunbookSchema> {
                id = 'runbook';
                name = 'Runbook';
                idPrefix = 'RB';
                schema = RunbookSchema;
                
                lintRules = [
                  {
                    id: 'runbook-has-steps',
                    severity: 'error',
                    message: 'Runbook must have at least one step',
                    check: (spec) => spec.steps.length === 0,
                  },
                ];
                
                renderers = [
                  {
                    format: 'markdown',
                    render: (specs, ctx) => specs.map(s => `# ${s.title}\n${s.symptoms.join('\n')}`).join('\n'),
                  },
                ];
              }
            description: Runbook model definition example
        seeAlso:
          - label: Model definition examples
            href: model-guide.md
        relations:
          - type: satisfies
            target: UC-001
            description: Satisfies requirement definition use case
          - type: satisfies
            target: UC-002
            description: Satisfies architecture definition use case
          - type: satisfies
            target: UC-004
            description: Satisfies concept model definition use case
      - id: FR-105
        name: Project Initialization
        description: Initialize a new speckeeper project with starter templates and basic model definitions
        type: functional
        priority: should
        category: common
        parentId: FR-100
        rationale: To provide a quick start experience for new users by generating project structure, configuration, and basic
          model definitions
        acceptanceCriteria:
          - id: FR-105-01
            description: speckeeper init creates design/ directory structure
            verificationMethod: test
          - id: FR-105-02
            description: speckeeper init generates speckeeper.config.ts with default settings
            verificationMethod: test
          - id: FR-105-03
            description: "speckeeper init generates package.json with type: module and dependencies"
            verificationMethod: test
          - id: FR-105-04
            description: speckeeper init generates tsconfig.json for TypeScript support
            verificationMethod: test
          - id: FR-105-05
            description: speckeeper init generates basic model definitions in design/_models/
            verificationMethod: test
          - id: FR-105-06
            description: speckeeper init generates sample specification files
            verificationMethod: test
          - id: FR-105-07
            description: Generated project passes speckeeper lint without errors
            verificationMethod: test
          - id: FR-105-08
            description: Generated project passes typecheck without errors
            verificationMethod: test
          - id: FR-105-09
            description: speckeeper init --force overwrites existing files
            verificationMethod: test
          - id: FR-105-10
            description: speckeeper init skips package.json if it already exists (without --force)
            verificationMethod: test
        notes: |-
          **Generated Files**

          | Path | Description |
          |------|-------------|
          | `design/` | Design directory root |
          | `design/_models/` | Model definitions directory |
          | `design/_models/requirement.ts` | Requirement model |
          | `design/_models/usecase.ts` | UseCase and Actor models |
          | `design/_models/entity.ts` | Entity model |
          | `design/_models/component.ts` | Component model |
          | `design/_models/term.ts` | Term model |
          | `design/_models/index.ts` | Model exports |
          | `design/index.ts` | Design entry point |
          | `design/requirements.ts` | Sample requirements |
          | `speckeeper.config.ts` | Configuration file |
          | `package.json` | Package manifest (if not exists) |
          | `tsconfig.json` | TypeScript configuration |
        examples:
          - language: bash
            code: |-
              # Initialize a new project
              npx speckeeper init

              # Force overwrite existing files
              npx speckeeper init --force
            description: Project initialization examples
        relations:
          - type: satisfies
            target: UC-001
            description: Satisfies requirement definition use case
      - id: FR-106
        name: Artifact Class-Based Scaffold
        description: Scaffold generates model files from a common base template based on artifact class specified in mermaid
          flowchart, replacing fixed node-to-template mappings
        type: functional
        priority: must
        category: common
        parentId: FR-105
        rationale: To eliminate fixed template mappings (NODE_ALIAS, TEMPLATE_META, CHECKER_ALIAS) and enable flexible artifact
          type addition via class specification
        acceptanceCriteria:
          - id: FR-106-01
            description: Scaffold recognizes artifact class on mermaid flowchart nodes and generates model files from a common base
              template
            verificationMethod: test
          - id: FR-106-02
            description: "Artifact class is used for: (1) aggregating same-class nodes into one model file, (2) deriving model/file
              names from class name, (3) selecting checker bindings for external nodes"
            verificationMethod: test
          - id: FR-106-03
            description: Multiple nodes with same artifact class are aggregated into a single model file
            verificationMethod: test
          - id: FR-106-04
            description: Nodes without artifact class are generated with base template using node ID as model name
            verificationMethod: test
          - id: FR-106-05
            description: Model name is PascalCase of node ID/class name, file name is kebab-case (e.g., class "requirement" → Model
              "Requirement", file "requirement.ts")
            verificationMethod: test
          - id: FR-106-06
            description: NODE_ALIAS (fixed node ID to template mapping) is removed
            verificationMethod: test
          - id: FR-106-07
            description: TEMPLATE_META (fixed template name to level/type/filename registry) is removed
            verificationMethod: test
          - id: FR-106-08
            description: CHECKER_ALIAS (fixed external node ID to checker template mapping) is removed
            verificationMethod: test
          - id: FR-106-09
            description: Fixed model template functions (requirement.ts, usecase.ts, term.ts, etc.) are removed; only base template
              remains
            verificationMethod: test
        relations:
          - type: refines
            target: FR-105
            description: Refines scaffold generation mechanism
      - id: FR-107
        name: Core-Provided Model Factories
        description: speckeeper core provides generic lint rule, exporter, schema, test checker, and coverage checker factories
          to simplify model definitions
        type: functional
        priority: must
        category: common
        parentId: FR-104
        rationale: To reduce model definition verbosity by extracting common patterns into reusable core-provided factories
        acceptanceCriteria:
          - id: FR-107-01
            description: "Core provides generic lint rule factories: field required check, array min length check, ID format check,
              child element ID format check"
            verificationMethod: test
          - id: FR-107-02
            description: "Core provides generic exporter factories: markdown single exporter (declarative title/metadata/section),
              markdown index exporter (declarative table columns)"
            verificationMethod: test
          - id: FR-107-03
            description: Core provides common schema base (id, name, description, relations) that models extend with custom fields
            verificationMethod: test
          - id: FR-107-04
            description: Core provides test verification common logic (test file search, spec ID reference check, test result
              parsing) usable by specifying test file path only
            verificationMethod: test
          - id: FR-107-05
            description: Core provides relation-based coverage checker common logic (coverage calculation against all IDs of target
              model)
            verificationMethod: test
          - id: FR-107-06
            description: All core-provided factories are optional; custom logic can coexist with core factories
            verificationMethod: test
        relations:
          - type: refines
            target: FR-104
            description: Refines model definition by providing reusable factories
      - id: FR-200
        name: External SSOT Reference
        description: Can define references to external SSOT (OpenAPI, DDL, IaC, etc.)
        type: functional
        priority: must
        category: model
        rationale: To manage API specifications and DB definitions with external tools while ensuring model consistency
        acceptanceCriteria:
          - id: FR-200-01
            description: Provides basic interfaces for APIRef/TableRef/IaCRef/BatchRef
            verificationMethod: test
          - id: FR-200-02
            description: Can set file path and identifier for referenced target
            verificationMethod: test
          - id: FR-200-03
            description: Can associate with related components and entities
            verificationMethod: test
        notes: |-
          | Reference | Target | Main Consistency Checks |
          |-----------|--------|------------------------|
          | `APIRef` | OpenAPI | operationId existence, Entity consistency |
          | `TableRef` | DDL/Prisma | Table existence, column consistency |
          | `IaCRef` | CloudFormation/Terraform | Resource existence, type consistency |
          | `BatchRef` | Step Functions/EventBridge | Definition existence, schedule consistency |
        seeAlso:
          - label: External SSOT Reference Details
            href: model-guide.md#10-external-ssot-reference
        relations:
          - type: satisfies
            target: UC-006
            description: Satisfies external SSOT consistency check use case
      - id: FR-201
        name: External SSOT Path Configuration
        description: External SSOT file paths (OpenAPI, DDL, test code, etc.) are configured in speckeeper.config.ts, not in
          mermaid flowcharts
        type: functional
        priority: must
        category: model
        parentId: FR-200
        rationale: To centralize runtime configuration (file paths) in config file, keeping mermaid flowcharts as scaffold-only
          artifacts
        acceptanceCriteria:
          - id: FR-201-01
            description: External SSOT file paths are defined in speckeeper.config.ts via ExternalSsotPaths
            verificationMethod: test
          - id: FR-201-02
            description: Mermaid flowchart is scaffold-only and does not contain runtime configuration such as file paths
            verificationMethod: review
        relations:
          - type: refines
            target: FR-200
            description: Refines external SSOT reference path management
      - id: FR-300
        name: Generation (build)
        description: Generate "human-readable artifacts (docs/)" and "machine-readable artifacts (specs/)" from TS models
        type: functional
        priority: must
        category: build
        acceptanceCriteria:
          - id: FR-300-01
            description: Can output human-readable artifacts (docs/)
            verificationMethod: test
          - id: FR-300-02
            description: Can output machine-readable artifacts (specs/)
            verificationMethod: test
          - id: FR-300-03
            description: Manual editing of artifacts is prohibited (subject to drift check)
            verificationMethod: review
        relations:
          - type: satisfies
            target: UC-002
            description: Satisfies architecture definition use case
      - id: FR-301
        name: Rendering Feature for External Programs
        description: Models provide text rendering functionality callable from external programs
        type: functional
        priority: must
        category: build
        parentId: FR-300
        rationale: To make model rendering functionality available to external programs (template engines, document generation
          tools, etc.)
        acceptanceCriteria:
          - id: FR-301-01
            description: Can define rendering functions in Model class via renderers property
            verificationMethod: test
          - id: FR-301-02
            description: Rendering can be invoked via common interface from external programs
            verificationMethod: test
          - id: FR-301-03
            description: Rendering results switch internally based on model class
            verificationMethod: test
          - id: FR-301-04
            description: Output format can be specified via format parameter
            verificationMethod: test
          - id: FR-301-05
            description: Regeneration produces identical content (idempotency)
            verificationMethod: test
        notes: |-
          **Design Policy**

          - speckeeper itself does not directly generate documents (docs/)
          - External programs (template engines, etc.) invoke model rendering functionality to generate documents
          - Model-specific rendering logic is consolidated in `design/_models/`
          - Common rendering interface (`Renderer`) is provided

          **Rendering Interface**

          | Method | Description |
          |--------|-------------|
          | `model.render(format, specs, ctx)` | Render in specified format |
          | `model.hasRenderer(format)` | Check if format is available |
          | `model.getAvailableFormats()` | List available formats |

          **RenderContext**

          | Property | Description |
          |----------|-------------|
          | `params` | Parameters (filter conditions, etc.) |
          | `markdown.table()` | Markdown table generation helper |
        examples:
          - language: typescript
            code: |-
              // Model renderers definition example
              protected renderers: Renderer<MySpec>[] = [
                {
                  format: 'table',
                  render: (specs, ctx) => ctx.markdown.table(
                    ['ID', 'Name'],
                    specs.map(s => [s.id, s.name])
                  ),
                },
                {
                  format: 'list',
                  render: (specs, _ctx) => specs.map(s => `- ${s.id}: ${s.name}`).join('\n'),
                },
              ];

              // Invocation example from external program
              import { myModel } from '../design/_models/my-model.ts';

              const table = myModel.render('table', specs, ctx);
              const list = myModel.render('list', specs, ctx);
            description: Rendering functionality definition and invocation example
        relations:
          - type: satisfies
            target: UC-002
            description: Satisfies architecture definition use case
      - id: FR-302
        name: Machine-readable Artifacts (specs/)
        description: Generate JSON Schema and requirement definitions from concept model entities
        type: functional
        priority: must
        category: build
        parentId: FR-300
        rationale: For use as contract definitions with external systems, validation, and input for lint/check/impact analysis
        acceptanceCriteria:
          - id: FR-302-01
            description: Entity attributes are mapped to JSON Schema properties
            verificationMethod: test
          - id: FR-302-02
            description: Can output reference resolution graph (specs/index.json)
            verificationMethod: test
        notes: |-
          | Output | Content |
          |--------|---------|
          | `specs/schemas/entities/` | JSON Schema (concept Entity common vocabulary) |
          | `specs/index.json` | Reference resolution graph (ID list and reference relations for all models) |

          > **Note**: speckeeper **does not generate implementation code**.
          > Implementation code is generated by external tools from external SSOT:
          > - API contract → External tools (generated from OpenAPI)
          > - DB connection → ORM/DDL tools (generated from DDL/Prisma)
        relations:
          - type: satisfies
            target: UC-002
            description: Satisfies architecture definition use case
      - id: FR-400
        name: Lint/Validation
        description: Provides lint functionality to verify model consistency
        type: functional
        priority: must
        category: lint
        acceptanceCriteria:
          - id: FR-400-01
            description: Can verify common lint items
            verificationMethod: test
          - id: FR-400-02
            description: Can define and execute model-specific custom lint rules
            verificationMethod: test
        relations:
          - type: satisfies
            target: UC-010
            description: Satisfies design consistency check use case
      - id: FR-401
        name: Common Lint Items
        description: Verify common lint items that apply to all models
        type: functional
        priority: must
        category: lint
        parentId: FR-400
        rationale: ID duplication and reference inconsistencies break traceability
        acceptanceCriteria:
          - id: FR-401-01
            description: Verify IDs are not duplicated within the same type
            verificationMethod: test
          - id: FR-401-02
            description: Verify IDs follow conventions
            verificationMethod: test
          - id: FR-401-03
            description: Verify referenced targets exist
            verificationMethod: test
          - id: FR-401-04
            description: Verify no circular references exist
            verificationMethod: test
          - id: FR-401-05
            description: Verify no TBDs remain at specified phase
            verificationMethod: test
          - id: FR-401-06
            description: Detect orphan elements (entities without relations, etc.)
            verificationMethod: test
        notes: |-
          | Check Item | Description |
          |------------|-------------|
          | ID Uniqueness | IDs are not duplicated within the same type |
          | ID Format | IDs follow conventions |
          | Reference Integrity | Referenced targets exist |
          | Circular Reference | No circular references |
          | Phase Gate | No TBDs remain at specified phase |
          | Orphan Elements | Detect entities without relations, etc. |
        relations:
          - type: satisfies
            target: UC-010
            description: Satisfies design consistency check use case
      - id: FR-402
        name: Custom Lint Rules
        description: Each model can define lintRules to verify model-specific constraints
        type: functional
        priority: must
        category: lint
        parentId: FR-400
        rationale: To verify model-specific constraints (layer violations, required attributes, etc.)
        acceptanceCriteria:
          - id: FR-402-01
            description: Can set lintRules in Model definition
            verificationMethod: test
          - id: FR-402-02
            description: Can set severity (error/warning/info)
            verificationMethod: test
          - id: FR-402-03
            description: Lint results include rule ID, message, and target ID
            verificationMethod: test
        examples:
          - language: typescript
            code: |-
              lintRules: LintRule<T>[] = [
                {
                  id: 'rule-id',
                  severity: 'error' | 'warning' | 'info',
                  message: 'Error message',
                  check: (spec) => /* true if problem exists */,
                },
              ];
            description: Custom lint rule definition example
        relations:
          - type: satisfies
            target: UC-010
            description: Satisfies design consistency check use case
      - id: FR-500
        name: Drift Check
        description: Detect if artifacts (docs/, specs/) have been manually edited
        type: functional
        priority: must
        category: drift
        rationale: To detect divergence between TS models and artifacts and maintain SSOT principle
        acceptanceCriteria:
          - id: FR-500-01
            description: After build execution, detect differences between generated docs//specs/ and committed files
            verificationMethod: test
          - id: FR-500-02
            description: Fail CI when differences are found
            verificationMethod: test
          - id: FR-500-03
            description: Output message prompting to "regenerate and commit"
            verificationMethod: test
          - id: FR-500-04
            description: Manual editing of artifacts is prohibited (detected by drift)
            verificationMethod: review
        relations:
          - type: satisfies
            target: UC-011
            description: Satisfies drift detection use case
      - id: FR-600
        name: External SSOT Consistency Check
        description: Verify consistency between TS models (external SSOT references) and external SSOT (OpenAPI, DDL, IaC, etc.)
        type: functional
        priority: must
        category: check
        acceptanceCriteria:
          - id: FR-600-01
            description: Existence check (referenced items exist in external artifacts)
            verificationMethod: test
          - id: FR-600-02
            description: Type check (expected type/class/category matches)
            verificationMethod: test
          - id: FR-600-03
            description: Constraint check (non-functional/guardrails are satisfied)
            verificationMethod: test
        relations:
          - type: satisfies
            target: UC-006
            description: Satisfies external SSOT consistency check use case
          - type: satisfies
            target: UC-012
            description: Satisfies contract consistency check use case
      - id: FR-601
        name: Three Categories of Consistency Check
        description: All external SSOT consistency checks are uniformly composed of existence, type, and constraint categories
        type: functional
        priority: must
        category: check
        parentId: FR-600
        acceptanceCriteria:
          - id: FR-601-01
            description: "Existence: Referenced items exist in external artifacts"
            verificationMethod: test
          - id: FR-601-02
            description: "Type: Expected type/class/category matches"
            verificationMethod: test
          - id: FR-601-03
            description: "Constraints: Non-functional/guardrails are satisfied"
            verificationMethod: test
        notes: |-
          | Category | Content | Examples |
          |----------|---------|----------|
          | **Existence** | Referenced items exist in external artifacts | operationId existence, table existence |
          | **Type** | Expected type/class/category matches | resourceType match, columnType match |
          | **Constraints** | Non-functional/guardrails are satisfied | Encryption required, PII classification |
        relations:
          - type: satisfies
            target: UC-006
            description: Satisfies external SSOT consistency check use case
      - id: FR-602
        name: Check Command
        description: Provide CLI command to execute external SSOT consistency check
        type: functional
        priority: must
        category: check
        parentId: FR-600
        rationale: Since consistency checks are implemented per model, filter by model name
        acceptanceCriteria:
          - id: FR-602-01
            description: speckeeper check runs external SSOT consistency check for all models
            verificationMethod: test
          - id: FR-602-02
            description: speckeeper check [type] filters checks by type (openapi, ddl, iac, external-ssot, test, contract)
            verificationMethod: test
          - id: FR-602-03
            description: Type argument corresponds to check categories, not model IDs
            verificationMethod: review
          - id: FR-602-04
            description: Only models with externalChecker are targeted
            verificationMethod: test
        examples:
          - language: bash
            code: |-
              # External SSOT consistency check for all models
              speckeeper check

              # Check specific type only
              speckeeper check external-ssot   # All external SSOT checks
              speckeeper check openapi         # OpenAPI consistency only
              speckeeper check ddl             # DDL consistency only
              speckeeper check test            # Test reference consistency
              speckeeper check contract        # Contract consistency
            description: Check command examples
        relations:
          - type: satisfies
            target: UC-006
            description: Satisfies external SSOT consistency check use case
      - id: FR-603
        name: External Checker
        description: Each model can define externalChecker to implement consistency check with external SSOT
        type: functional
        priority: must
        category: check
        parentId: FR-600
        rationale: Clarify model responsibilities by including external SSOT consistency check logic in model definition
        acceptanceCriteria:
          - id: FR-603-01
            description: Can set externalChecker in Model definition
            verificationMethod: test
          - id: FR-603-02

            verificationMethod: test
          - id: FR-1100-03
            description: --show-prompt outputs the constructed prompt without calling LLM
            verificationMethod: test
          - id: FR-1100-04
            description: --fail-on controls minimum severity that causes non-zero exit
            verificationMethod: test
          - id: FR-1100-05
            description: Report format is selectable via --report-format (json, text, yaml)
            verificationMethod: test
        relations:
          - type: satisfies
            target: UC-010
            description: Satisfies design consistency check use case via LLM
      - id: FR-1101
        name: LLM-Powered Trace Link Proposal
        description: Propose candidate traceability links between specs with confidence scores and rationale using LLM analysis
        type: functional
        priority: should
        category: llm
        rationale: Manual traceability maintenance is error-prone; LLM can identify semantically related specs that humans may
          overlook
        acceptanceCriteria:
          - id: FR-1101-01
            description: propose-trace-links command analyzes all specs and proposes missing trace links
            verificationMethod: test
          - id: FR-1101-02
            description: Each proposed link includes source ID, target ID, relation type, confidence score, and rationale
            verificationMethod: test
          - id: FR-1101-03
            description: --show-prompt outputs the constructed prompt without calling LLM
            verificationMethod: test
        relations:
          - type: satisfies
            target: UC-010
            description: Supports design consistency via automated traceability
      - id: FR-1102
        name: LLM-Powered Impact Explanation
        description: Translate impact analysis JSON output into human-readable explanation for PM/executive audiences using LLM
        type: functional
        priority: should
        category: llm
        rationale: Raw impact analysis JSON is not consumable by non-technical stakeholders; LLM can generate natural language
          summaries
        acceptanceCriteria:
          - id: FR-1102-01
            description: explain-impact command reads impact analysis JSON from stdin
            verificationMethod: test
          - id: FR-1102-02
            description: Output is a human-readable explanation suitable for PM/executive audiences
            verificationMethod: review
          - id: FR-1102-03
            description: --show-prompt outputs the constructed prompt without calling LLM
            verificationMethod: test
        relations:
          - type: refines
            target: FR-700
            description: Refines change impact analysis with human-readable output
      - id: FR-1103
        name: LLM-Powered Acceptance Criteria Proposal
        description: Propose testable acceptance criteria in Given/When/Then format for specified specs using LLM
        type: functional
        priority: should
        category: llm
        rationale: Writing testable acceptance criteria is time-consuming; LLM can propose initial criteria that humans refine
        acceptanceCriteria:
          - id: FR-1103-01
            description: propose-acceptance-criteria command generates criteria for specified spec IDs (or all)
            verificationMethod: test
          - id: FR-1103-02
            description: Proposed criteria follow Given/When/Then format
            verificationMethod: review
          - id: FR-1103-03
            description: --show-prompt outputs the constructed prompt without calling LLM
            verificationMethod: test
        relations:
          - type: satisfies
            target: UC-001
            description: Assists requirement definition with automated criteria proposals
      - id: FR-1104
        name: TypeScript to YAML Conversion
        description: Convert TypeScript spec data files to equivalent YAML format, enabling non-TypeScript workflows and
          interoperability
        type: functional
        priority: should
        category: conversion
        rationale: YAML input lowers participation barriers for non-developers (NFR-005) and enables interoperability with
          external tools
        acceptanceCriteria:
          - id: FR-1104-01
            description: convert command reads a TS file exporting a SpecModule via defineSpecs() and writes equivalent YAML
            verificationMethod: test
          - id: FR-1104-02
            description: Output defaults to same filename with .yaml extension
            verificationMethod: test
          - id: FR-1104-03
            description: --output allows specifying a custom output path
            verificationMethod: test
          - id: FR-1104-04
            description: --dry-run previews conversion without writing files
            verificationMethod: test
        relations:
          - type: refines
            target: FR-104
            description: Extends model definition with format conversion
      - id: FR-1200
        name: Review Check Declaration
        description: Declare per-target LLM review checks with target selection, context provider, prompt, output schema,
          model class, and optional verifier
        type: functional
        priority: should
        category: review
        rationale: Project-wide LLM audits (FR-1100) cannot scale to large designs, cannot be tied to individual specs, and
          leave no record that lint or CI can consume
        acceptanceCriteria:
          - id: FR-1200-01
            description: Checks are declared in config review.checks or in a Model's reviewChecks
            verificationMethod: test
          - id: FR-1200-02
            description: A check's select() returns targets with their spec IDs; default is one target per spec of the model
            verificationMethod: test
          - id: FR-1200-03
            description: A check's output is built with defineReviewOutput; projects can add only extra and findingExtra
              fields
            verificationMethod: test
        relations:
          - type: satisfies
            target: UC-010
            description: Satisfies design consistency check use case via per-target LLM review
      - id: FR-1201
        name: Review Context Provider
        description: Build the LLM context for one target and report the spec IDs and files it read
        type: functional
        priority: should
        category: review
        parentId: FR-1200
        acceptanceCriteria:
          - id: FR-1201-01
            description: build() may be sync or async and returns body, inputs, and optional files
            verificationMethod: test
          - id: FR-1201-02
            description: The built-in relations provider reuses the impact traversal over the same reference graph, with
              configurable depth, relation types, and edge filter, in a stable order
            verificationMethod: test
        relations:
          - type: refines
            target: FR-1200
            description: Refines the check's context
          - type: dependsOn
            target: FR-700
            description: Follows relations with the impact traversal
      - id: FR-1202
        name: Review Packet Hash
        description: Hash the packet from check id, prompt, output JSON Schema, context body, file contents, and verifier
          prompt, excluding the model
        type: functional
        priority: should
        category: review
        parentId: FR-1200
        acceptanceCriteria:
          - id: FR-1202-01
            description: Identical specs and config produce identical hashes across OS, time, and concurrency
            verificationMethod: test
          - id: FR-1202-02
            description: --show-packet prints the packet without calling the LLM
            verificationMethod: test
          - id: FR-1202-03
            description: The judge signature (adapter, model, verifier model) is recorded separately from the packet hash
            verificationMethod: test
        relations:
          - type: refines
            target: FR-1200
            description: Refines what a judgment is about
      - id: FR-1203
        name: Review Judge Execution
        description: Run each packet through @aaac/runtime runTask with a read-only reviewer agent, no tools, and the
          check's output schema
        type: functional
        priority: should
        category: review
        parentId: FR-1200
        acceptanceCriteria:
          - id: FR-1203-01
            description: The adapter is created with tools [] and an empty temporary cwd
            verificationMethod: test
          - id: FR-1203-02
            description: Schema mismatches get one follow-up correction; persistent mismatches are reported as failures
            verificationMethod: test
          - id: FR-1203-03
            description: On usage-limit or rate-limit responses, no new calls start and completed records are kept
            verificationMethod: test
          - id: FR-1203-04
            description: Token usage from TaskRunResult is stored in the record
            verificationMethod: test
        relations:
          - type: refines
            target: FR-1200
            description: Refines how a check is judged
      - id: FR-1204
        name: Review Credential Policy
        description: Classify adapter credentials before calling the LLM, skip the run when no credentials are available,
          and optionally refuse API-key billing
        type: functional
        priority: should
        category: review
        parentId: FR-1200
        rationale: CI and other environments without credentials must not fail on review, while local runs must not
          silently fall back to unintended API-key billing
        acceptanceCriteria:
          - id: FR-1204-01
            description: With CI set and no credential variables, review exits 0 without touching records and reports the skip
            verificationMethod: test
          - id: FR-1204-02
            description: --require-judge turns an unavailable judge into exit code 14
            verificationMethod: test
          - id: FR-1204-03
            description: With allowApiKey false and an API key present, review exits 13 without calling the LLM
            verificationMethod: test
        relations:
          - type: refines
            target: FR-1203
            description: Refines when the judge may run
      - id: FR-1205
        name: Review Output Schema
        description: Provide a common finding shape (code, severity, message, subject, location, evidence, suggestion)
          owned by speckeeper, let projects add fields only through defineReviewOutput, and treat unknown IDs or quotes
          not found in the packet as a schema mismatch
        type: functional
        priority: should
        category: review
        parentId: FR-1200
        acceptanceCriteria:
          - id: FR-1205-01
            description: Severity uses the lint scale (error, warning, info)
            verificationMethod: test
          - id: FR-1205-02
            description: Unknown spec IDs in subject or evidence are handled as a schema mismatch (one follow-up, then target
              failure)
            verificationMethod: test
          - id: FR-1205-03
            description: A location.quote not contained in the packet context after whitespace normalization is handled as a
              schema mismatch
            verificationMethod: test
        relations:
          - type: refines
            target: FR-1200
            description: Refines the check's output
      - id: FR-1206
        name: Incremental Review Selection
        description: Judge only targets whose record is missing or stale (packet hash changed, or judge signature changed
          under judgeChange stale) using the same staleness function as the gate; support --force, --check,
          --target, and --dry-run
        type: functional
        priority: should
        category: review
        parentId: FR-1200
        acceptanceCriteria:
          - id: FR-1206-01
            description: An unchanged target is skipped without calling the LLM
            verificationMethod: test
          - id: FR-1206-02
            description: --dry-run lists targets to run and to skip with the changed inputs as reasons, and estimates token
              usage from previous records
            verificationMethod: test
          - id: FR-1206-03
            description: --max-targets caps one run in a stable order so that split runs never judge a target twice
            verificationMethod: test
        relations:
          - type: refines
            target: FR-1203
            description: Refines which targets are judged
      - id: FR-1207
        name: Review Verifier
        description: Optionally re-check each finding in a separate call and mark false positives without deleting them
        type: functional
        priority: could
        category: review
        parentId: FR-1200
        acceptanceCriteria:
          - id: FR-1207-01
            description: Findings judged false_positive keep their text and carry status false_positive and the verifier
              rationale
            verificationMethod: test
        relations:
          - type: refines
            target: FR-1203
            description: Refines the judgment with a second opinion per finding
      - id: FR-1208
        name: Judgment Record Store
        description: Store one deterministic YAML record per check and target, and carry finding status across
          re-judgments
        type: functional
        priority: should
        category: review
        parentId: FR-1200
        acceptanceCriteria:
          - id: FR-1208-01
            description: Records are written with stable key order and sorting
            verificationMethod: test
          - id: FR-1208-02
            description: speckeeper computes each finding's fingerprint from check, target, code, subject (or normalized
              quote), and sorted evidence, never from message
            verificationMethod: test
          - id: FR-1208-03
            description: dismissed requires statusNote
            verificationMethod: test
          - id: FR-1208-04
            description: Records store per-input hashes (prompt, schema, each spec, each file) used only to explain staleness
            verificationMethod: test
          - id: FR-1208-05
            description: Status carries over only for one-to-one fingerprint matches; other findings become open
            verificationMethod: test
        relations:
          - type: refines
            target: FR-1200
            description: Refines where judgments are kept
      - id: FR-1209
        name: Review Gate in Lint
        description: Add REVIEW-001 (missing or stale record), REVIEW-002 (open blocking finding), REVIEW-003 (orphaned
          record), and REVIEW-004 (judge change) to the common lint items when review is configured
        type: functional
        priority: should
        category: review
        parentId: FR-1200
        acceptanceCriteria:
          - id: FR-1209-01
            description: lint evaluates the gate without network access or LLM credentials
            verificationMethod: test
          - id: FR-1209-02
            description: Gate severities are configurable as error, warning, or off
            verificationMethod: test
          - id: FR-1209-03
            description: REVIEW-003 warns on records whose check or target no longer exists; review --prune removes them
            verificationMethod: test
          - id: FR-1209-04
            description: gate.judgeChange ignore, warning, and stale respectively skip, report REVIEW-004 for, and mark
              stale records whose judge signature differs from the configured one; review uses the same staleness function
            verificationMethod: test
        relations:
          - type: refines
            target: FR-400
            description: Adds the review gate to the common lint items
      - id: FR-1210
        name: Manual Review Emit and Ingest
        description: Emit packets for external judging and ingest schema-valid results whose packet hash still matches
        type: functional
        priority: could
        category: review
        parentId: FR-1200
        acceptanceCriteria:
          - id: FR-1210-01
            description: ingest rejects results whose packet hash differs from the current one
            verificationMethod: test
        relations:
          - type: refines
            target: FR-1203
            description: Refines judging outside the SDK
      - id: FR-1211
        name: Single LLM Runtime
        description: Run all LLM features through @aaac/runtime and declare it and the Claude Agent SDK as optional
          peerDependencies
        type: functional
        priority: should
        category: llm
        rationale: agent-contracts-runtime is deprecated in favor of @aaac/runtime; two runtimes would split adapter,
          retry, and credential handling
        acceptanceCriteria:
          - id: FR-1211-01
            description: FR-1100 to FR-1103 commands execute via @aaac/runtime executeTask
            verificationMethod: test
          - id: FR-1211-02
            description: package.json declares @aaac/runtime as an optional peer dependency
            verificationMethod: inspection
        relations:
          - type: refines
            target: FR-1100
            description: Changes the runtime the LLM commands run on
      - id: FR-1212
        name: Review Rebaseline
        description: Accept stale records as current without calling the LLM, keeping findings and recording the reason
        type: functional
        priority: should
        category: review
        parentId: FR-1200
        rationale: A change to a widely shared input (prompt wording, a commonly included spec) otherwise forces every
          target to be judged again even when the change cannot affect the verdict
        acceptanceCriteria:
          - id: FR-1212-01
            description: rebaseline updates packetHash and inputHashes, keeps findings and status, and appends from, to,
              changedInputs, reason, at, gitHead, and gitDirty without any personal identity
            verificationMethod: test
          - id: FR-1212-02
            description: rebaseline requires --reason and skips targets that have no record
            verificationMethod: test
        relations:
          - type: refines
            target: FR-1206
            description: Refines how a stale record becomes current
      - id: FR-1213
        name: Review Rules
        description: Declare the points a review check judges as rules (code, severity, description); with rules, findings
          use only declared codes and take their rule's severity
        type: functional
        priority: should
        category: review
        parentId: FR-1200
        rationale: A point written only in the prompt cannot bind the judge; a code outside it is recorded, and the
          judge's choice of severity makes the blocking gate depend on the judgment
        acceptanceCriteria:
          - id: FR-1213-01
            description: A check declares rules with a code, severity, and description; the packet lists them and its hash
              covers them; empty rules, malformed rules, and a code declared twice are configuration errors
            verificationMethod: test
          - id: FR-1213-02
            description: With rules, a finding code that is not a declared rule code is a schema mismatch
            verificationMethod: test
          - id: FR-1213-03
            description: With rules, the judge gives no severity and every finding is recorded with its rule's severity,
              including results taken in with review ingest
            verificationMethod: test
          - id: FR-1213-04
            description: A check without rules keeps the common output, where the judge chooses the code and the severity
            verificationMethod: test
        relations:
          - type: refines
            target: FR-1205
            description: Refines the output with declared codes and severities
  - model: nonfunctional-requirement
    specs:
      - id: NFR-001
        name: Command Execution Time
        description: lint/build/drift within 1 minute for typical requirement scale (~500 items), check within 2 minutes
          (depends on file count)
        type: non-functional
        priority: should
        category: performance
        acceptanceCriteria:
          - id: NFR-001-01
            description: lint/build/drift within 60 seconds for 500 requirements scale
            verificationMethod: test
          - id: NFR-001-02
            description: check within 120 seconds for 1000 files scale
            verificationMethod: test
          - id: NFR-001-03
            description: build within 5 seconds for 1000 requirements, 100 entities, 50 screens
            verificationMethod: test
      - id: NFR-002
        name: Node.js Compatibility
        description: Works on Node.js (LTS)
        type: non-functional
        priority: must
        category: portability
        acceptanceCriteria:
          - id: NFR-002-01
            description: Verified on Node.js 22 LTS
            verificationMethod: test
          - id: NFR-002-02
            description: Verified on Node.js 24 LTS
            verificationMethod: test
      - id: NFR-003
        name: Multi-OS Support
        description: Avoid OS dependencies and work on Linux/macOS
        type: non-functional
        priority: must
        category: portability
        acceptanceCriteria:
          - id: NFR-003-01
            description: Verified on Linux (Ubuntu)
            verificationMethod: test
          - id: NFR-003-02
            description: Verified on macOS
            verificationMethod: test
          - id: NFR-003-04
            description: Eliminate OS-dependent code such as path separators
            verificationMethod: review
      - id: NFR-004
        name: User-defined Models
        description: Users can define custom models by inheriting from Model base class
        type: non-functional
        priority: must
        category: extensibility
        acceptanceCriteria:
          - id: NFR-004-01
            description: Can define new models by inheriting from Model base class
            verificationMethod: test
          - id: NFR-004-02
            description: Can define model-specific schema, lint rules, and renderers
            verificationMethod: test
          - id: NFR-004-03
            description: Models registered in speckeeper.config.ts become targets of lint/build/check
            verificationMethod: test
      - id: NFR-005
        name: Input Format Diversity
        description: Allow YAML/JSON input to lower participation barriers for non-developers
        type: non-functional
        priority: should
        category: extensibility
        acceptanceCriteria:
          - id: NFR-005-01
            description: Support TypeScript DSL input
            verificationMethod: test
          - id: NFR-005-02
            description: Support YAML format input
            verificationMethod: demo
          - id: NFR-005-03
            description: Support JSON format input
            verificationMethod: demo
      - id: NFR-006
        name: Rule Extensibility
        description: Allow adding lint and check rules via plugin mechanism
        type: non-functional
        priority: should
        category: extensibility
        acceptanceCriteria:
          - id: NFR-006-01
            description: Custom lint rules can be added
            verificationMethod: demo
          - id: NFR-006-02
            description: Custom check rules (external SSOT verification) can be added
            verificationMethod: demo
          - id: NFR-006-03
            description: Rules are defined under Model._models/
            verificationMethod: review
      - id: NFR-007
        name: Error Message Clarity
        description: Output errors showing requirement ID, file, and field name, providing messages that clearly show "why it
          failed"
        type: non-functional
        priority: must
        category: transparency
        acceptanceCriteria:
          - id: NFR-007-01
            description: Errors include requirement ID/specification ID
            verificationMethod: test
          - id: NFR-007-02
            description: Errors include file path and line number (when possible)
            verificationMethod: test
          - id: NFR-007-03
            description: Errors include problematic field name
            verificationMethod: test
          - id: NFR-007-04
            description: Provide hints for fixes
            verificationMethod: review
      - id: NFR-008
        name: TypeScript Compatibility
        description: Type checking passes on TypeScript 5.0+
        type: non-functional
        priority: must
        category: compatibility
        acceptanceCriteria:
          - id: NFR-008-01
            description: Compiles successfully on TypeScript 5.0
            verificationMethod: test
          - id: NFR-008-02
            description: No type errors in strict mode
            verificationMethod: test
      - id: NFR-009
        name: ESM Support
        description: Provided in ES Modules format
        type: non-functional
        priority: must
        category: compatibility
        acceptanceCriteria:
          - id: NFR-009-01
            description: Can be imported via import statement
            verificationMethod: test
          - id: NFR-009-02
            description: Tree-shaking works
            verificationMethod: inspection
      - id: NFR-010
        name: npm Distribution
        description: Can be distributed as npm package
        type: non-functional
        priority: must
        category: deployability
        acceptanceCriteria:
          - id: NFR-010-01
            description: Can publish package via npm publish
            verificationMethod: demo
          - id: NFR-010-02
            description: Can install via npm install speckeeper
            verificationMethod: demo
      - id: NFR-011
        name: CLI Test Infrastructure
        description: All CLI commands have comprehensive test coverage with traceability to specifications
        type: non-functional
        priority: must
        category: testability
        acceptanceCriteria:
          - id: NFR-011-01
            description: All child requirements (NFR-012~NFR-015) are satisfied
            verificationMethod: review
        relations:
          - type: satisfies
            target: UC-010
            description: Satisfies design consistency check use case
      - id: NFR-012
        name: CLI Command Test Coverage
        description: Each CLI command (lint, check, build, impact, drift, new) has a corresponding test file in test/cli/ with
          requirement ID references
        type: non-functional
        priority: must
        category: testability
        parentId: NFR-011
        rationale: To prevent regression bugs in CLI commands that directly affect all users and CI pipelines
        acceptanceCriteria:
          - id: NFR-012-01
            description: Test files exist in test/cli/ for each CLI command (lint, check, build, impact, drift, new)
            verificationMethod: test
          - id: NFR-012-02
            description: describe/it block names contain corresponding requirement IDs (FR-xxx)
            verificationMethod: test
          - id: NFR-012-03
            description: CLI module statement coverage reaches 60% or above (from 0%)
            verificationMethod: test
        relations:
          - type: satisfies
            target: UC-010
            description: Satisfies design consistency check use case
      - id: NFR-013
        name: Test-Specification Traceability
        description: TestRef definitions in design/test-refs.yaml provide bidirectional traceability between tests and specifications
        type: non-functional
        priority: must
        category: testability
        parentId: NFR-011
        rationale: To ensure all acceptance criteria are covered by test cases and maintain spec-test traceability
        acceptanceCriteria:
          - id: NFR-013-01
            description: TestRef definitions (TEST-020~025) exist in design/test-refs.yaml for each CLI test file
            verificationMethod: test
          - id: NFR-013-02
            description: TestRefs are linked to corresponding command IDs via implementsCommand
            verificationMethod: test
          - id: NFR-013-03
            description: speckeeper check test succeeds for all TestRefs
            verificationMethod: test
          - id: NFR-013-04
            description: speckeeper check test --coverage achieves 100% for target acceptance criteria
            verificationMethod: test
        relations:
          - type: refines
            target: FR-604
            description: Refines coverage verification for CLI tests
      - id: NFR-014
        name: CLI Definition-Implementation Consistency
        description: CLI command definitions in design/cli-commands.yaml match cli-contract.yaml and generated code in src/generated/
        type: non-functional
        priority: must
        category: testability
        parentId: NFR-011
        rationale: To ensure specification, DSL contract, and generated implementation stay synchronized
        acceptanceCriteria:
          - id: NFR-014-01
            description: All command definitions in design/cli-commands.yaml match cli-contract.yaml and generated code
              (parameters, subcommands, exit codes)
            verificationMethod: test
        relations:
          - type: satisfies
            target: UC-010
            description: Satisfies design consistency check use case
      - id: NFR-015
        name: CLI Backward Compatibility
        description: Existing public APIs and CLI behavior are not changed by test additions
        type: non-functional
        priority: must
        category: testability
        parentId: NFR-011
        rationale: To ensure test strengthening does not introduce regressions
        acceptanceCriteria:
          - id: NFR-015-01
            description: All existing tests continue to pass (no regression)
            verificationMethod: test
          - id: NFR-015-02
            description: No changes to existing public API or CLI behavior
            verificationMethod: review
        relations:
          - type: satisfies
            target: UC-010
            description: Satisfies design consistency check use case
      - id: NFR-016
        name: Lint Without Network or LLM Credentials
        description: lint uses no network access and no LLM credentials, including the review gate
        type: non-functional
        priority: must
        category: reliability
        rationale: The review gate runs in CI, where LLM credentials are not expected
        acceptanceCriteria:
          - id: NFR-016-01
            description: lint evaluates REVIEW-001 to REVIEW-004 from records and packets only, with credential variables unset
            verificationMethod: test
        relations:
          - type: satisfies
            target: UC-010
            description: Satisfies design consistency check use case
      - id: NFR-017
        name: Deterministic Review Packets
        description: Packets built from the same specs and config hash identically regardless of OS, time, and concurrency
        type: non-functional
        priority: must
        category: reliability
        rationale: A record is current only while its packet hash matches; a hash that varied by environment would make
          records stale for no reason
        acceptanceCriteria:
          - id: NFR-017-01
            description: Building a packet twice, in a different order, and from CRLF prompt files gives the same hash
            verificationMethod: test
        relations:
          - type: satisfies
            target: UC-010
            description: Satisfies design consistency check use case
  - model: constraint
    specs:
      - id: CR-001
        name: Minimize External Dependencies
        description: Limit external dependencies to stable libraries like Zod, Commander, Chalk
        type: constraint
        priority: should
        category: technical
        acceptanceCriteria:
          - id: CR-001-01
            description: Keep dependency package count under 20
            verificationMethod: inspection
          - id: CR-001-02
            description: Use only packages with stable major versions
            verificationMethod: review
      - id: CR-002
        name: Zero-config Startup
        description: Basic functionality works without config file
        type: constraint
